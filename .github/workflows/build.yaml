name: Build

on:
    workflow_dispatch:
    release:
        types: [created]

permissions:
    contents: write

jobs:
    build-frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up node
              uses: actions/setup-node@v7
              with:
                  node-version: 26

            - name: Build frontend
              run: |
                  npm install
                  npm run build
            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-dist
                  path: dist/*
    build-server:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                targets:
                    - os: windows
                      arch: amd64
                      ext: .exe
                    - os: windows
                      arch: '386'
                      ext: .exe
                    - os: darwin
                      arch: amd64
                      ext: ''
                    - os: darwin
                      arch: arm64
                      ext: ''
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version: '1.26'
                  cache: false

            - name: Build server
              working-directory: server
              env:
                  GOOS: ${{ matrix.targets.os }}
                  GOARCH: ${{ matrix.targets.arch }}
              run: go build -o dist/WebremoteForSongbeamer${{ matrix.targets.ext }}

            - name: Licenses
              run: |
                  cd server
                  go install github.com/google/go-licenses/v2@latest
                  go-licenses save . --ignore "github.com/todm/webremoteForSongbeamer" --save_path=dist/licenses

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: server-${{ matrix.targets.os }}-${{ matrix.targets.arch }}
                  path: server/dist/*

    publish:
        runs-on: ubuntu-latest
        if: github.event_name == 'release'
        needs: ['build-frontend', 'build-server']
        env:
            GH_TOKEN: ${{ github.token }}
            RELEASE_TAG: ${{ github.ref_name }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Download build artifacts
              uses: actions/download-artifact@v8
              with:
                  path: _bundle

            - name: Bundle
              run: |
                  cd _bundle
                  for dir in server-*; do
                    mkdir "$dir/static/"
                    cp -r frontend-dist/* "$dir/static/"
                  done
                  rm -rf frontend-dist

                  for dir in server-*; do
                    zip_name="${dir/server-/WebremoteForSongbeamer-${{github.ref_name}}-}"
                    (
                      cd "$dir"
                      zip -r "../${zip_name}.zip" .
                    )
                    rm -rf "$dir"
                  done
                  ls -la

            - name: Release assets
              run: |
                  assets=( _bundle/*.zip )
                  gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
